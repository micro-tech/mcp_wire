[package]
name = "mcp-wire"
version = "0.1.0"
edition = "2021"
description = "Standalone MCP server (stdio) exposing Wireshark/tshark to any LLM: live packet capture, pcap analysis, and full interface details."
license = "MIT"

[[bin]]
name = "mcp-wire"
path = "src/main.rs"

[lib]
name = "mcp_wire"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
